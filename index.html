<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic-Tac-Toe Arena</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .topbar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 24px; background: #1a1a2e;
      font-family: 'Outfit', sans-serif; font-size: 0.95rem; color: #fffffe;
      border-bottom: 1px solid #2d2d44;
    }
    .topbar .stats { display: flex; gap: 18px; }
    .topbar .stat { text-align: center; }
    .topbar .stat small { display: block; color: #a7a9be; font-size: 0.75rem; }
    .topbar .stat strong { font-size: 1.1rem; }
    .btn-logout {
      background: #e94560; color: #fff; border: none; padding: 7px 16px;
      border-radius: 8px; cursor: pointer; font-family: 'Outfit', sans-serif;
      font-size: 0.9rem; font-weight: 600;
    }
    .btn-logout:hover { background: #c73652; }
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      display: flex; justify-content: center; align-items: center; z-index: 100;
    }
    .modal {
      background: #1a1a2e; border-radius: 16px; padding: 36px;
      width: 100%; max-width: 380px; text-align: center;
      font-family: 'Outfit', sans-serif;
    }
    .modal h2 { margin-bottom: 8px; color: #fffffe; }
    .modal p { color: #a7a9be; margin-bottom: 20px; font-size: 0.9rem; }
    .modal input {
      width: 100%; padding: 11px 14px; border-radius: 10px;
      border: 1.5px solid #2d2d44; background: #0f0e17; color: #fffffe;
      font-family: 'Outfit', sans-serif; font-size: 1rem; margin-bottom: 12px; outline: none;
    }
    .modal input:focus { border-color: #e94560; }
    .modal button {
      width: 100%; padding: 12px; border-radius: 10px; border: none;
      background: #e94560; color: #fff; font-family: 'Outfit', sans-serif;
      font-size: 1rem; font-weight: 700; cursor: pointer;
    }
    .modal button:hover { background: #c73652; }
  </style>
</head>
<body>

  <div class="topbar">
    <div>👤 <strong id="topbar-username">...</strong></div>
    <div class="stats">
      <div class="stat"><small>Wins</small><strong id="db-wins">0</strong></div>
      <div class="stat"><small>Losses</small><strong id="db-losses">0</strong></div>
      <div class="stat"><small>Draws</small><strong id="db-draws">0</strong></div>
    </div>
    <button class="btn-logout" onclick="logout()">Logout</button>
  </div>

  <div class="modal-overlay" id="nameModal">
    <div class="modal">
      <h2>🎮 Set Player Names</h2>
      <p>Enter names for both players before starting</p>
      <input type="text" id="nameX" placeholder="Player X name" />
      <input type="text" id="nameO" placeholder="Player O name" />
      <button onclick="startGame()">Start Game</button>
    </div>
  </div>

  <main class="app">
    <section class="panel">
      <h1>Tic-Tac-Toe Arena</h1>
      <p class="subtitle">First to make a line wins the round.</p>
      <div class="scoreboard" aria-label="Scoreboard">
        <div class="score-card x">
          <span id="label-x">Player X</span>
          <strong id="score-x">0</strong>
        </div>
        <div class="score-card draw">
          <span>Draws</span>
          <strong id="score-draw">0</strong>
        </div>
        <div class="score-card o">
          <span id="label-o">Player O</span>
          <strong id="score-o">0</strong>
        </div>
      </div>
      <p id="status" class="status" role="status" aria-live="polite">Player X's turn</p>
      <div class="board" id="board" aria-label="Tic tac toe board">
        <button class="cell" data-index="0" aria-label="Cell 1"></button>
        <button class="cell" data-index="1" aria-label="Cell 2"></button>
        <button class="cell" data-index="2" aria-label="Cell 3"></button>
        <button class="cell" data-index="3" aria-label="Cell 4"></button>
        <button class="cell" data-index="4" aria-label="Cell 5"></button>
        <button class="cell" data-index="5" aria-label="Cell 6"></button>
        <button class="cell" data-index="6" aria-label="Cell 7"></button>
        <button class="cell" data-index="7" aria-label="Cell 8"></button>
        <button class="cell" data-index="8" aria-label="Cell 9"></button>
      </div>
      <div class="actions">
        <button id="next-round" class="btn primary">Next Round</button>
        <button id="restart" class="btn secondary">Restart Match</button>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
